volumes:
  comet_data:

services:
  comet:
    container_name: comet
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_PATH: /data/comet.db
    image: comet:local
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - comet_data:/data
